name: Build App Store IPA (signed)

# Produces a properly signed, App-Store-upload-ready .ipa using a real
# Apple Distribution certificate + provisioning profiles. Does nothing
# useful until the required secrets below are set in the repo's Settings ->
# Secrets and variables -> Actions, so this only runs on manual dispatch,
# not on every push, unlike the unsigned sideload workflow.
#
# Required secrets (all base64-encoded file contents unless noted):
#   APPLE_TEAM_ID                       - your 10-char Apple Developer Team ID
#   APPLE_CERTIFICATE_P12_BASE64        - Distribution .p12 certificate
#   APPLE_CERTIFICATE_PASSWORD          - password used when exporting the .p12
#   APPLE_KEYCHAIN_PASSWORD             - any throwaway password for the temp CI keychain
#   APPLE_PROVISIONING_PROFILE_RUNNER_BASE64        - App Store profile for com.ImJustIvaan.MimClock
#   APPLE_PROVISIONING_PROFILE_RUNNER_NAME          - that profile's exact name
#   APPLE_PROVISIONING_PROFILE_WIDGET_BASE64        - App Store profile for the .MinimalClockWidget extension
#   APPLE_PROVISIONING_PROFILE_WIDGET_NAME          - that profile's exact name
#   APPLE_PROVISIONING_PROFILE_WATCH_BASE64         - App Store profile for the .watchkitapp target
#   APPLE_PROVISIONING_PROFILE_WATCH_NAME           - that profile's exact name
#
# Leaves the signed IPA as a downloadable workflow artifact named
# "MinimalClock-AppStore.ipa". To actually submit it to App Store Connect,
# run the separate "Upload App Store Build" workflow afterward — it picks up
# this workflow's latest successful artifact.
on:
  workflow_dispatch:

jobs:
  build-appstore-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # App Store Connect now rejects uploads built with anything older
      # than the iOS 26 SDK (Xcode 26), which isn't macos-15's default
      # Xcode. Pin to whatever the latest stable Xcode actually installed
      # on the runner is, rather than relying on the default.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Import signing certificate into a temporary keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/appstore-signing.keychain-db"
          security create-keychain -p "${{ secrets.APPLE_KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ secrets.APPLE_KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"

          echo "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${{ secrets.APPLE_KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Install provisioning profiles
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_RUNNER_BASE64 }}" | base64 --decode \
            > "$PROFILES_DIR/runner.mobileprovision"
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGET_BASE64 }}" | base64 --decode \
            > "$PROFILES_DIR/widget.mobileprovision"
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_WATCH_BASE64 }}" | base64 --decode \
            > "$PROFILES_DIR/watch.mobileprovision"

      - name: Generate ExportOptions.plist
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ImJustIvaan.MimClock</key>
              <string>${{ secrets.APPLE_PROVISIONING_PROFILE_RUNNER_NAME }}</string>
              <key>com.ImJustIvaan.MimClock.MinimalClockWidget</key>
              <string>${{ secrets.APPLE_PROVISIONING_PROFILE_WIDGET_NAME }}</string>
              <key>com.ImJustIvaan.MimClock.watchkitapp</key>
              <string>${{ secrets.APPLE_PROVISIONING_PROFILE_WATCH_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      # `flutter build ios`/`build ipa` normally handles CocoaPods install
      # and Flutter's generated Xcode integration files as an internal step
      # before ever invoking xcodebuild. Calling `xcodebuild archive`
      # directly skips all of that, so Pods (flutter_local_notifications
      # etc.) are never installed and the archive fails to find them. This
      # unsigned, throwaway build's only purpose is to trigger that setup.
      - name: Prepare CocoaPods and generated Flutter files
        run: flutter build ios --release --no-codesign

      # `flutter build ipa` does archive + export as one opaque step, which
      # leaves no way to embed the separately-built Watch app in between.
      # So this replicates it as two explicit xcodebuild calls instead, with
      # the Watch app copied into the archive right before export — export
      # then re-signs it too, since its bundle ID is now listed in
      # ExportOptions.plist's provisioningProfiles map above.
      - name: Archive Runner
        run: |
          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath build/ios/archive/Runner.xcarchive \
            -destination 'generic/platform=iOS'

      # Built separately from the Runner archive (not as a project
      # dependency) for the same reason as build-unsigned-ipa.yml: building
      # it alongside Runner forces the wrong SDK onto it. -target bypasses
      # scheme/destination inference and builds straight from the watch
      # target's own project settings (SDKROOT=watchos, and — since this
      # morning — CODE_SIGN_STYLE=Manual with its own App Store profile).
      - name: Build and sign Watch app
        run: |
          xcodebuild build \
            -project ios/Runner.xcodeproj \
            -target MinimalClockWatch \
            -configuration Release \
            SYMROOT=build/watch_dd

      - name: Embed Watch app into the archive
        run: |
          # SYMROOT above resolves relative to -project's directory (ios/),
          # not the repo root, so the product lands at
          # ios/build/watch_dd/... rather than build/watch_dd/...
          WATCH_DEST="build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app/Watch"
          mkdir -p "$WATCH_DEST"
          cp -r ios/build/watch_dd/Release-watchos/MinimalClockWatch.app "$WATCH_DEST/"

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/Runner.xcarchive \
            -exportPath build/ios/ipa \
            -exportOptionsPlist ios/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: MinimalClock-AppStore.ipa
          path: build/ios/ipa/*.ipa
