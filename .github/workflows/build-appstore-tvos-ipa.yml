name: Build tvOS App Store IPA (signed)

# Produces a properly signed, App-Store-upload-ready .ipa for the tvOS app.
# Shares the same bundle ID (com.ImJustIvaan.MimClock) and Apple
# Distribution certificate as the iOS app, submitted as an additional
# platform under the same App Store Connect app record (Universal
# Purchase) rather than a separate listing.
#
# Required secrets (all base64-encoded file contents unless noted):
#   APPLE_TEAM_ID                       - your 10-char Apple Developer Team ID
#   APPLE_CERTIFICATE_P12_BASE64        - same Apple Distribution .p12 as the iOS build
#   APPLE_CERTIFICATE_PASSWORD          - password used when exporting that .p12
#   APPLE_KEYCHAIN_PASSWORD             - any throwaway password for the temp CI keychain
#   APPLE_PROVISIONING_PROFILE_TV_BASE64        - tvOS App Store profile for com.ImJustIvaan.MimClock
#   APPLE_PROVISIONING_PROFILE_TV_NAME          - that profile's exact name
on:
  workflow_dispatch:

jobs:
  build-appstore-tvos-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # The tvOS target has no Flutter/plugin code of its own, but Xcode
      # resolves the whole project's Swift Package graph before it even
      # looks at the requested scheme, and that graph references
      # ios/Flutter/ephemeral/Packages/FlutterGeneratedPluginSwiftPackage,
      # which only gets generated by `flutter pub get`.
      - name: Install dependencies
        run: flutter pub get

      - name: Import signing certificate into a temporary keychain
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/appstore-signing.keychain-db"
          security create-keychain -p "${{ secrets.APPLE_KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "${{ secrets.APPLE_KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"

          echo "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -T /usr/bin/codesign -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "${{ secrets.APPLE_KEYCHAIN_PASSWORD }}" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

      - name: Install provisioning profile
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_TV_BASE64 }}" | base64 --decode \
            > "$PROFILES_DIR/tv.mobileprovision"

      - name: Generate ExportOptions.plist
        run: |
          cat > ios/ExportOptionsTV.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.ImJustIvaan.MimClock</key>
              <string>${{ secrets.APPLE_PROVISIONING_PROFILE_TV_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archive MinimalClockTV
        run: |
          xcodebuild archive \
            -project ios/Runner.xcodeproj \
            -scheme MinimalClockTV \
            -configuration Release \
            -archivePath build/ios/archive/MinimalClockTV.xcarchive \
            -destination 'generic/platform=tvOS'

      - name: Export signed IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/ios/archive/MinimalClockTV.xcarchive \
            -exportPath build/ios/ipa-tvos \
            -exportOptionsPlist ios/ExportOptionsTV.plist

      - uses: actions/upload-artifact@v4
        with:
          name: MinimalClockTV-AppStore.ipa
          path: build/ios/ipa-tvos/*.ipa
