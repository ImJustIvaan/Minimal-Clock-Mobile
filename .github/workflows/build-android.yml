name: Build Android APK & AAB

# Release builds fall back to the debug keystore (see android/app/build.gradle)
# when no real signing secrets are configured, so the APK still installs
# directly on a device with no extra setup. Once ANDROID_KEYSTORE_BASE64 and
# friends are added as repo secrets (see android/key.properties.example for
# the fields they map to), this reconstructs a real upload keystore instead
# so the AAB is genuinely ready for a Play Store upload.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # `secrets` can't be referenced directly in a step's `if:` condition
      # (GitHub rejects the workflow at validation time), so the check
      # happens in bash instead, using env vars populated from the secrets.
      - name: Set up release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set - falling back to debug signing."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release AAB
        run: flutter build appbundle --release

      - name: Rename outputs
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MinimalClock.apk
          cp build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/MinimalClock.aab

      - uses: actions/upload-artifact@v4
        with:
          name: MinimalClock.apk
          path: build/app/outputs/flutter-apk/MinimalClock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MinimalClock.aab
          path: build/app/outputs/bundle/release/MinimalClock.aab
